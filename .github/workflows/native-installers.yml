name: Native installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            extension: dmg
          - platform: windows-x64
            os: windows-2025
            extension: msi
          - platform: linux-x64
            os: ubuntu-24.04
            extension: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk+jmods
          cache: maven

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VT_MACHINE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/package.ps1

      - name: Package macOS or Linux installer
        if: runner.os != 'Windows'
        shell: bash
        env:
          VT_MACHINE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/package.sh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: virtual-thread-machine-${{ matrix.platform }}
          path: target/dist/*.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: virtual-thread-machine-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --title "$GITHUB_REF_NAME"
          fi
